<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <title>PetFeedr bowl scale — side view</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#555"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="600" fill="#222">Bowl scale — side view (not to scale)</text>

  <!-- floor -->
  <line x1="20" y1="395" x2="880" y2="395" stroke="#777" stroke-width="2"/>
  <text x="24" y="414" fill="#777">concrete floor</text>

  <!-- rubber feet -->
  <rect x="115" y="385" width="26" height="10" fill="#333"/>
  <rect x="525" y="385" width="26" height="10" fill="#333"/>

  <!-- base plate -->
  <rect x="100" y="365" width="465" height="20" fill="#dcb67a" stroke="#8a6a3a"/>
  <text x="575" y="380" fill="#222">base plate</text>

  <!-- left spacer (cell to base) -->
  <rect x="170" y="345" width="42" height="20" fill="#9aa0a6" stroke="#555"/>

  <!-- load cell bar -->
  <rect x="170" y="318" width="320" height="27" rx="2" fill="#cfd4d9" stroke="#555"/>
  <rect x="318" y="326" width="44" height="11" fill="#ffffff" stroke="#555"/>
  <circle cx="318" cy="331.5" r="8" fill="#ffffff" stroke="#555"/>
  <circle cx="362" cy="331.5" r="8" fill="#ffffff" stroke="#555"/>
  <line x1="318" y1="331.5" x2="362" y2="331.5" stroke="#ffffff" stroke-width="10"/>
  <circle cx="191" cy="331.5" r="4" fill="#555"/>
  <circle cx="469" cy="331.5" r="4" fill="#555"/>

  <!-- right spacer (cell to top plate) -->
  <rect x="448" y="298" width="42" height="20" fill="#9aa0a6" stroke="#555"/>

  <!-- top plate -->
  <rect x="100" y="278" width="465" height="20" fill="#dcb67a" stroke="#8a6a3a"/>
  <text x="575" y="293" fill="#222">top plate (platter)</text>

  <!-- retainer lip -->
  <rect x="140" y="262" width="11" height="16" fill="#b8915a" stroke="#8a6a3a"/>
  <rect x="514" y="262" width="11" height="16" fill="#b8915a" stroke="#8a6a3a"/>
  <text x="575" y="270" fill="#222">retainer lip</text>
  <line x1="572" y1="266" x2="528" y2="268" stroke="#999"/>

  <!-- bowl -->
  <path d="M165,205 L495,205 L452,278 L208,278 Z" fill="#b9c0c7" stroke="#555" stroke-width="1.5"/>
  <path d="M215,262 Q330,232 445,262 L452,278 L208,278 Z" fill="#8b5a2b" opacity="0.85"/>
  <text x="300" y="250" fill="#fff" font-weight="600">kibble</text>

  <!-- chute -->
  <rect x="312" y="40" width="40" height="140" fill="#f4f4f4" stroke="#888"/>
  <text x="300" y="70" fill="#222" text-anchor="end">PVC drop</text>
  <text x="300" y="86" fill="#666" text-anchor="end">shorten by platter</text>
  <text x="300" y="100" fill="#666" text-anchor="end">height (~4–5 cm)</text>

  <!-- clearance callout -->
  <line x1="372" y1="180" x2="372" y2="203" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="382" y="168" fill="#c0392b" font-weight="600">≥ 1 cm clear on every side</text>
  <text x="382" y="184" fill="#c0392b">any contact steals load</text>

  <!-- flex zone callout -->
  <line x1="340" y1="352" x2="340" y2="342" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="362" fill="#c0392b" font-size="12">flex zone — must touch nothing</text>

  <!-- load path note -->
  <text x="100" y="312" fill="#555" font-size="12">5 kg single-point cell (Z-mount)</text>

  <!-- crossbar + ADC -->
  <rect x="740" y="165" width="150" height="18" fill="#dcb67a" stroke="#8a6a3a"/>
  <text x="772" y="200" fill="#222" text-anchor="end">lower crossbar</text>
  <rect x="758" y="122" width="90" height="43" rx="4" fill="#2f6f3e" stroke="#1d4527"/>
  <text x="772" y="141" fill="#fff" font-weight="600">NAU7802</text>
  <text x="778" y="157" fill="#d6eadb" font-size="11">in a box</text>

  <!-- cell wires -->
  <path d="M490,331 L720,331 C770,331 780,240 790,166" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M490,335 L724,335 C778,335 788,245 798,166" fill="none" stroke="#222" stroke-width="2"/>
  <path d="M490,339 L728,339 C786,339 796,250 806,166" fill="none" stroke="#999" stroke-width="2"/>
  <path d="M490,327 L716,327 C762,327 772,235 782,166" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="590" y="320" fill="#222" font-size="12">4 cell wires, &lt; 30 cm</text>
  

  <!-- I2C up to Pi -->
  <line x1="803" y1="122" x2="803" y2="52" stroke="#2c5aa0" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="748" y="22" width="110" height="30" rx="4" fill="#c51a4a"/>
  <text x="768" y="42" fill="#fff" font-weight="600">Raspberry Pi</text>
  <text x="810" y="80" fill="#2c5aa0" font-size="12">I2C ≤ 1 m</text>
  <text x="810" y="95" fill="#2c5aa0" font-size="12">GPIO 2 / 3</text>
</svg>
