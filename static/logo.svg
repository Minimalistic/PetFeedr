<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00969e"/>
      <stop offset="100%" stop-color="#006d75"/>
    </linearGradient>
    <linearGradient id="bowl-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="ear-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8a0a0"/>
      <stop offset="100%" stop-color="#f08080"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <g transform="translate(256,248)">
    <!-- Shadow under bowl -->
    <ellipse cx="0" cy="148" rx="110" ry="16" fill="rgba(0,0,0,0.12)"/>

    <!-- Bowl body -->
    <path d="M-125,72 C-125,72 -115,145 0,145 S125,72 125,72" fill="url(#bowl-shade)" stroke="#fff" stroke-width="3"/>
    <!-- Bowl rim -->
    <ellipse cx="0" cy="72" rx="125" ry="40" fill="#f5f5f5" stroke="#fff" stroke-width="3"/>
    <!-- Bowl inner -->
    <ellipse cx="0" cy="72" rx="105" ry="30" fill="#e8e8e8"/>

    <!-- Kibble pieces - varied shapes -->
    <ellipse cx="-50" cy="60" rx="13" ry="10" fill="#c8956c" transform="rotate(-15,-50,60)"/>
    <ellipse cx="-20" cy="52" rx="11" ry="9" fill="#d4a574" transform="rotate(20,-20,52)"/>
    <ellipse cx="15" cy="58" rx="12" ry="9" fill="#c08050" transform="rotate(-8,15,58)"/>
    <ellipse cx="45" cy="54" rx="10" ry="8" fill="#d4a574" transform="rotate(25,45,54)"/>
    <ellipse cx="-35" cy="48" rx="10" ry="8" fill="#c8956c" transform="rotate(10,-35,48)"/>
    <ellipse cx="0" cy="68" rx="11" ry="8" fill="#c08050" transform="rotate(-20,0,68)"/>
    <ellipse cx="30" cy="68" rx="10" ry="8" fill="#c8956c" transform="rotate(15,30,68)"/>
    <ellipse cx="-55" cy="72" rx="9" ry="7" fill="#d4a574" transform="rotate(-5,-55,72)"/>

    <!-- Cat ears - outer -->
    <path d="M-85,-75 C-82,-105 -72,-148 -55,-148 C-42,-148 -25,-110 -18,-82" fill="#fff"/>
    <path d="M85,-75 C82,-105 72,-148 55,-148 C42,-148 25,-110 18,-82" fill="#fff"/>
    <!-- Cat ears - inner pink -->
    <path d="M-75,-80 C-73,-105 -67,-135 -55,-135 C-46,-135 -33,-110 -28,-88" fill="url(#ear-inner)"/>
    <path d="M75,-80 C73,-105 67,-135 55,-135 C46,-135 33,-110 28,-88" fill="url(#ear-inner)"/>

    <!-- Cat head -->
    <ellipse cx="0" cy="-38" rx="72" ry="62" fill="#fff"/>

    <!-- Eyes -->
    <ellipse cx="-24" cy="-50" rx="11" ry="13" fill="#00838f"/>
    <ellipse cx="24" cy="-50" rx="11" ry="13" fill="#00838f"/>
    <!-- Eye highlights -->
    <circle cx="-20" cy="-54" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="28" cy="-54" r="4" fill="#fff" opacity="0.8"/>
    <!-- Pupils -->
    <ellipse cx="-24" cy="-48" rx="5" ry="7" fill="#004d52"/>
    <ellipse cx="24" cy="-48" rx="5" ry="7" fill="#004d52"/>

    <!-- Nose -->
    <path d="M-7,-30 Q0,-24 7,-30 Q0,-35 -7,-30 Z" fill="#f08080"/>

    <!-- Mouth -->
    <path d="M0,-24 Q-8,-18 -12,-22" fill="none" stroke="#e0a0a0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,-24 Q8,-18 12,-22" fill="none" stroke="#e0a0a0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="-75" y1="-38" x2="-38" y2="-35" stroke="#d0d0d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-72" y1="-48" x2="-38" y2="-44" stroke="#d0d0d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-70" y1="-28" x2="-38" y2="-28" stroke="#d0d0d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="75" y1="-38" x2="38" y2="-35" stroke="#d0d0d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="-48" x2="38" y2="-44" stroke="#d0d0d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="-28" x2="38" y2="-28" stroke="#d0d0d0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <circle cx="-42" cy="-28" r="12" fill="#f8a0a0" opacity="0.3"/>
    <circle cx="42" cy="-28" r="12" fill="#f8a0a0" opacity="0.3"/>
  </g>
</svg>
