# Flags private detail in commit messages pushed here, including commits from
# cloud Claude sessions, which never run the local git hooks. Detection only:
# by the time this runs the commit is public, so a failure means reword the
# branch (or squash it away) before it reaches main.
#
# Shapes are kept in step with the local commit-msg hook. The term list comes
# from the PRIVATE_TERMS secret (one regex per line) and is never printed.
# Secrets in messages are left to GitHub's push protection.
name: Commit message scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan new commit messages
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Only commits this push or PR adds; older history isn't rescanned.
          if [ -n "$BASE_SHA" ]; then
            range=("$BASE_SHA..$HEAD_SHA")
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=("$BEFORE..$HEAD_SHA")
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            range=("$HEAD_SHA" --not "origin/$DEFAULT_BRANCH")
          else
            # Force-push to the default branch: the old tip is gone, check the newest.
            range=(-n 20 "$HEAD_SHA")
          fi

          patterns=(
            '[a-z0-9-]+\.[a-z0-9-]+\.ts\.net|Tailnet hostname'
            '\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b|Tailscale IP'
            '\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b|LAN IP'
            '\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|Private IP'
            '/Users/[a-z0-9._-]+/|Home directory path'
            'claude\.ai/code/session_|Claude Code session link'
          )
          terms=()
          while IFS= read -r term; do
            term="${term%$'\r'}"
            term="${term%"${term##*[![:space:]]}"}"
            [[ -z "$term" || "$term" == \#* ]] || terms+=("$term")
          done <<< "$PRIVATE_TERMS"
          [ ${#terms[@]} -eq 0 ] && echo "::warning::PRIVATE_TERMS secret not set; checking shapes only."

          fail=0
          # A typo'd term must fail loudly, not silently stop matching.
          # The step runs under bash -e, so grep's status is caught, not left bare.
          for i in "${!terms[@]}"; do
            rc=0
            grep -qiE -e "${terms[$i]}" <<< "" 2>/dev/null || rc=$?
            if [ $rc -eq 2 ]; then echo "::error::PRIVATE_TERMS entry $((i + 1)) is not a valid regex"; fail=1; fi
          done
          for sha in $(git rev-list "${range[@]}"); do
            message=$(git log -1 --format=%B "$sha")
            for entry in "${patterns[@]}"; do
              lines=$(grep -niE -e "${entry%|*}" <<< "$message" | cut -d: -f1 | paste -sd, -)
              [ -n "$lines" ] && { echo "::error::${sha:0:7} message line $lines: ${entry##*|}"; fail=1; }
            done
            for term in "${terms[@]}"; do
              lines=$(grep -niE -e "$term" <<< "$message" | cut -d: -f1 | paste -sd, -)
              [ -n "$lines" ] && { echo "::error::${sha:0:7} message line $lines: private term"; fail=1; }
            done
          done
          [ $fail -eq 0 ] && echo "Commit messages clean."
          exit $fail
